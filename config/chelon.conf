# Chelon Configuration
# This file is managed by the chelon RPM package

# Server binding
CHELON_HOST=127.0.0.1
CHELON_PORT=5050

# GPG home directory (classical RSA keys)
GNUPGHOME=/var/lib/chelon/.gnupg

# Sequoia home directory (V6 / Sequoia-backed keys). Also accepted as SEQUOIA_HOME.
# Requires sequoia-sq on the Chelon host (Fedora 43+ or EL10.1+).
CHELON_SEQUOIA_HOME=/var/lib/chelon/.sequoia

# Logging
LOG_LEVEL=INFO
